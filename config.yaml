# Central pipeline configuration. Environment overrides (highest precedence):
#   EPL_SEASONS        comma-separated season codes, e.g. "2021,2122,2223,2324,2425,2526"
#   EPL_FIXTURE_URL    override for the openfootball fixture feed
#   EPL_FIXTURE_SEASON season label for the fixture feed, e.g. "2026-27"
#   EPL_SPLIT_DATE     time-series validation cutoff, e.g. "2024-01-01"
#   LOG_LEVEL          DEBUG | INFO | WARNING | ERROR

data:
  seasons: ["1819", "1920", "2021", "2122", "2223", "2324", "2425", "2526"]
  historical_url_template: "https://raw.githubusercontent.com/datasets/football-datasets/master/datasets/premier-league/season-{}.csv"
  fixture_url: "https://raw.githubusercontent.com/openfootball/england/master/2026-27/1-premierleague.txt"
  fixture_season: "2026-27"

pipeline:
  split_date: "2024-01-01"

model:
  home_advantage: 65.0
  blend_classifier: 0.6
  blend_poisson: 0.0
  blend_supremacy: 0.4
  calibration_grid_min: 1.0
  calibration_grid_max: 3.0
  calibration_grid_step: 0.05
  draw_rule:
    # RPS-constrained receipt from the disjoint evaluation/forecast grids.
    market_margin: 0.12
    market_min_prob: 0.24
    no_market_margin: 0.12
    no_market_min_prob: 0.25
  # Fraction of training rows whose market features are masked to neutral
  # (odds_missing=1). Teaches the model the no-market regime so serving
  # rows without cached market odds behave sanely. Seeded; deterministic.
  # Exponential training-sample decay by age (days halving time). Recent
  # seasons teach current strength; ancient ones stabilize estimates.
  # Ablated 2026-09-14 on 8-season data (RF RPS: off 0.2082, 730d
  # 0.2084, 365d 0.2068): 365d wins. Falsy disables (uniform weights).
  recency_half_life_days: 365
  odds_mask_rate: 0.15
  market_blend_grid_step: 0.05
  market_blend_max_weight: 0.50
  ewm_spans: [5, 10]
